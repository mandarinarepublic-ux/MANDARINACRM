<style>
.mrp{--n:#FF5E0E;--k:#0F0B07;background:var(--k);color:#fff;border-radius:16px;padding:18px 0 16px;margin:0 auto 18px;max-width:760px;font-family:inherit;overflow:hidden;box-shadow:4px 4px 0 var(--n)}
.mrp[hidden]{display:none}
.mrp__top{padding:0 16px}
.mrp__tag{display:inline-block;background:#D62828;color:#fff;font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;padding:4px 10px;border-radius:999px}
.mrp__t{margin:10px 0 4px;font-size:24px;line-height:1.1;font-weight:900;color:#fff;text-transform:uppercase}
.mrp__t b{color:var(--n)}
.mrp__s{margin:0;font-size:14px;color:#e8ddd4}
.mrp__cd{margin-top:8px;font-size:13px;color:#ffd2b8;font-weight:700}
.mrp__fila{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:14px 16px 4px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.mrp__fila::-webkit-scrollbar{display:none}
.mrp__c{flex:0 0 42%;max-width:170px;scroll-snap-align:start;background:#fff;color:var(--k);border-radius:12px;overflow:hidden;text-decoration:none;display:flex;flex-direction:column}
.mrp__c img{width:100%;height:auto;aspect-ratio:1/1;object-fit:cover;display:block;background:#f3ece6}
.mrp__cn{font-size:12px;font-weight:700;line-height:1.25;padding:8px 8px 2px;color:var(--k);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.mrp__cp{padding:2px 8px 10px;font-size:15px;font-weight:900;color:var(--n)}
.mrp__cp s{color:#8a7f76;font-weight:600;font-size:12px;margin-left:4px}
.mrp__btn{display:block;margin:12px 16px 0;text-align:center;background:var(--n);color:#fff;font-weight:900;font-size:16px;padding:14px;border-radius:12px;text-decoration:none;text-transform:uppercase}
.mrp a.mrp__btn,.mrp a.mrp__btn:visited{color:#fff!important}
.mrp a.mrp__c,.mrp a.mrp__c:visited{color:var(--k)!important}
/* Arriba va compacto: el cliente vino a buscar su pedido y el buscador no puede quedar lejos. */
.mrp--mini{padding:14px 0 12px}
.mrp--mini .mrp__s{display:none}
.mrp--mini .mrp__t{font-size:20px;margin-top:8px}
.mrp--mini .mrp__fila{padding-top:10px}
.mrp--mini .mrp__c{flex-basis:30%}
.mrp--mini .mrp__cn{font-size:11px;padding:6px 6px 0}
.mrp--mini .mrp__cp{font-size:13px;padding:2px 6px 8px}
.mrp--mini .mrp__btn{padding:10px;font-size:14px;margin-top:10px}
@media (min-width:750px){.mrp__c{flex-basis:23%}.mrp--mini .mrp__c{flex-basis:15%}.mrp__t{font-size:30px}.mrp--mini .mrp__t{font-size:24px}}
</style>

<div id="mrp-arriba" class="mrp mrp--mini" hidden></div>

<div id="mr-seguimiento" style="width:100%;margin:0 auto;"><iframe id="mr-seguimiento-marco" src="https://crm.apps.mandarinaec.com/pedido" title="Sigue tu pedido" loading="eager" style="width:100%;height:1100px;border:0;display:block;" allow="clipboard-write"></iframe></div>

<div id="mrp-abajo" class="mrp" style="margin-top:18px" hidden></div>

<script>
(function(){
  var marco = document.getElementById('mr-seguimiento-marco');
  var abajo = document.getElementById('mrp-abajo');
  window.addEventListener('message', function(e){
    if (e.origin !== 'https://crm.apps.mandarinaec.com') return;
    var d = e.data || {};
    if (d.tipo === 'mandarina-pedido-altura' && d.alto > 0 && marco) {
      marco.style.height = Math.max(500, Math.ceil(d.alto) + 20) + 'px';
    }
    // El CRM avisa si el cliente ve su pedido ('hoja') o el buscador ('entrada').
    if (d.tipo === 'mandarina-pedido-vista' && abajo) {
      window.__mrpVista = d.vista;
      if (abajo.getAttribute('data-listo')) abajo.hidden = d.vista !== 'hoja';
    }
  });
})();
</script>

<script>
// Banner "revisa los productos" de la página Sigue tu pedido (14-nov-2026).
// Para cambiar de campaña: tocar solo CONFIG. Pasada la fecha, sigue mostrando
// la colección a precio normal, sin "preventa" ni tachado.
(function(){
  var CONFIG = {
    coleccion: 'ugly-sweaters',
    etiqueta: '🎄 Preventa Navidad',
    titulo: 'Ugly Sweaters a <b>$25</b>',
    tituloSinPromo: 'Ugly Sweaters de <b>Navidad</b>',
    texto: 'Ya que estás por aquí: mira los diseños de esta Navidad. Envío gratis a todo Ecuador.',
    descuento: 5,                              // dólares menos durante la preventa
    hasta: '2026-11-25T23:59:59-05:00',        // fin de la preventa (hora de Ecuador)
    boton: 'Ver todos los diseños →',
    cuantos: 8
  };
  var arriba = document.getElementById('mrp-arriba');
  var abajo = document.getElementById('mrp-abajo');
  if (!arriba || !abajo) return;
  var fin = new Date(CONFIG.hasta).getTime();
  var enPromo = function(){ return Date.now() < fin; };
  var url = '/collections/' + CONFIG.coleccion;
  var esc = function(t){ return String(t).replace(/[&<>"]/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]; }); };
  var dinero = function(n){ n = Math.round(n * 100) / 100; return '$' + (n % 1 ? n.toFixed(2) : n); };

  function tarjetas(prods){
    return prods.map(function(p){
      var precio = Math.min.apply(null, p.variants.map(function(v){ return parseFloat(v.price); }));
      var img = p.images && p.images[0] ? p.images[0].src : '';
      if (img) img += (img.indexOf('?') < 0 ? '?' : '&') + 'width=360';
      var nombre = p.title.replace(/^Ugly Sweaters?\s+(Navideño\s+)?/i, '').replace(/^-\s*/, '');
      var ps = enPromo() && CONFIG.descuento
        ? dinero(precio - CONFIG.descuento) + '<s>' + dinero(precio) + '</s>'
        : dinero(precio);
      return '<a class="mrp__c" href="/products/' + encodeURIComponent(p.handle) + '">' +
        (img ? '<img loading="lazy" src="' + esc(img) + '" alt="' + esc(p.title) + '">' : '') +
        '<span class="mrp__cn">' + esc(nombre || p.title) + '</span>' +
        '<span class="mrp__cp">' + ps + '</span></a>';
    }).join('');
  }

  function pintar(prods){
    var promo = enPromo();
    var html = '<div class="mrp__top">' +
      (promo ? '<span class="mrp__tag">' + CONFIG.etiqueta + '</span>' : '') +
      '<h2 class="mrp__t">' + (promo ? CONFIG.titulo : CONFIG.tituloSinPromo) + '</h2>' +
      '<p class="mrp__s">' + esc(CONFIG.texto) + '</p>' +
      (promo ? '<div class="mrp__cd" data-cd></div>' : '') +
      '</div>' +
      (prods.length ? '<div class="mrp__fila">' + tarjetas(prods) + '</div>' : '') +
      '<a class="mrp__btn" href="' + url + '">' + esc(CONFIG.boton) + '</a>';
    arriba.innerHTML = html;
    abajo.innerHTML = html;
    arriba.hidden = false;
    abajo.setAttribute('data-listo', '1'); // abajo se prende solo cuando el CRM muestra la hoja
    abajo.hidden = window.__mrpVista !== 'hoja';
    reloj();
  }

  function reloj(){
    var cds = document.querySelectorAll('.mrp [data-cd]');
    if (!cds.length) return;
    var tick = function(){
      var ms = fin - Date.now();
      if (ms <= 0) { cds.forEach(function(c){ c.textContent = ''; }); return; }
      var d = Math.floor(ms / 864e5), h = Math.floor(ms / 36e5) % 24, m = Math.floor(ms / 6e4) % 60;
      var t = '⏳ Termina en ' + (d ? d + (d === 1 ? ' día ' : ' días ') : '') + h + ' h ' + m + ' min';
      cds.forEach(function(c){ c.textContent = t; });
    };
    tick(); setInterval(tick, 30000);
  }

  fetch(url + '/products.json?limit=24')
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){
      var disp = (d.products || []).filter(function(p){
        return p.variants && p.variants.some(function(v){ return v.available; });
      }).slice(0, CONFIG.cuantos);
      pintar(disp);
    })
    .catch(function(){ pintar([]); }); // sin fotos, el banner igual invita con el botón
})();
</script>
